  const doc = await lib.getDocument({ data, isEvalSupported: false }).promise;
  log('doc opened: ' + doc.numPages + ' pages');
  let textAll = '';
  for (let i = 1; i <= Math.min(doc.numPages, 10); i++) {
    const page = await doc.getPage(i);
    const base = page.getViewport({ scale: 1 });
    const scale = Math.min(3, Math.max(1, 1600 / Math.max(base.width, base.height)));
    const vp = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let dark = 0;
    for (let p = 0; p < img.length; p += 40) { if (img[p] < 128) dark++; }
    log('page ' + i + ' rendered ' + canvas.width + 'x' + canvas.height + ', dark samples=' + dark);
    const tc = await page.getTextContent();
    let s = ''; let px = 0, py = 0, pw = 0, has = false;
    for (const raw of tc.items) {
